<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Shared lab results · Sealed</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="share-page">
  <header class="top">
    <div class="brand"><span class="seal-mark" aria-hidden="true"></span><span class="brand-name">Sealed</span></div>
    <span class="chip">Shared with a doctor · read only</span>
  </header>
  <main id="main">
    <section class="card" id="share-card">
      <p class="note" id="share-status">Loading the shared results…</p>
    </section>
    <p class="note share-foot">Personal details were removed on the patient's own device before this was shared. Values were checked against each report's own reference range by Sealed's code. This is a plain-language summary, not a diagnosis. <a href="./">About Sealed</a></p>
  </main>
  <script type="module" src="js/share.js"></script>
</body>
</html>
